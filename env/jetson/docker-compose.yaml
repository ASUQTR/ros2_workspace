services:
  # ==========================================
  # 1. ASUQTR CORE (Control, Autonomy, Hardware)
  # ==========================================
  sub_control_core:
    # TODO add docker repository prefix to image when repository server available
    image: asuqtr_ros2:latest
    container_name: asuqtr_ros2
    runtime: nvidia
    privileged: true
    network_mode: "host"
    shm_size: "1gb"
    stdin_open: true
    tty: true
    restart: unless-stopped
    volumes:
      - /tmp/argus_socket:/tmp/argus_socket
      - /dev:/dev
      - ./:/workspace
      - ../../workspace/packages:/workspace/src
    # 1. Build workspace packages on first run (artifacts persist via volume).
    # 2. Start FlexBE webui on port 8000.
    # rosbridge (:9090) starts when sub_launch is run manually inside the container.
    command: >
      bash -c "
        source /opt/underlay_ws/install/setup.bash &&
        cd /workspace &&
        if [ ! -d install ]; then
          echo '[asuqtr_ros2] First run: building workspace packages...' &&
          colcon build --symlink-install --cmake-args -DBUILD_TESTING=OFF;
        fi &&
        source install/setup.bash &&
        exec ros2 run flexbe_webui webui_node --host 0.0.0.0 --port 8000
      "

  # ==========================================
  # 2. ASUQTR DASHBOARD
  # ==========================================
  asuqtr-dashboard:
    # TODO add docker repository prefix to image when repository server available
    image: asuqtr-dashboard:latest
    container_name: asuqtr-dashboard
    ports:
        - "80:80"

