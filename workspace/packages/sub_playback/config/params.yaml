playback_node:
  ros__parameters:
    waypoint_timing: 0.2  # Record the manual-assisted target at 5 Hz
    keyframe_translation_m: 0.25
    keyframe_yaw_deg: 10.0
    keyframe_depth_m: 0.10
    keyframe_max_interval_sec: 2.0
    position_tolerance: 0.15
    depth_tolerance: 0.10
    angle_tolerance_deg: 10.0
    waypoint_timeout_sec: 8.0
    min_waypoint_hold_sec: 0.2
    target_republish_period_sec: 0.2
    odometry_timeout_sec: 0.75
    magnetic_play_enabled: true
