# config/control_params.yaml
control_node:
  ros__parameters:
    # Execution Mode: 'behavior', 'lqr_tuning', 'manual', or 'manual_assisted'
    control_mode: "lqr_tuning"
    
    # Q MATRIX (State Error Cost): Penalizes being away from the target.
    #  Higher Q = "Get to the target immediately." This increases overall output force.
    #    - Position Q (Indices 0-2 -> x,y,z): Acts like a Spring. Pulls the Sub to the target.
    #    - Angle Q (Indices 3-5 -> roll,pitch,yaw): Acts like a Torsional Spring. Snaps heading.
    #    - Velocity Q (Indices 6-11-> vx, vy, vz, vroll, vpitch, vyaw): Acts like a Damper (Shock Absorber). 
     #     High velocity Q forces the Sub to brake smoothly to avoid overshoot.
    state_cost_matrix: [1052.4762, 578.7808, 670.0731, 3134.6757, 3959.9523, 2453.9726, 265.1124, 303.5306, 204.2912, 12.3207, 19.8116, 12.2442]
    
    # R MATRIX (Thruster Cost): Penalizes using thruster energy. 
    #  Higher R = "Save battery, thrust is expensive." This lowers overall output force.
    thruster_cost_matrix: [15.0, 15.0, 15.0, 15.0, 15.0, 15.0, 15.0, 15.0]

    # Hard software saturation for each thruster command in Newtons.
    max_thruster_force_newton: 14.4

    # The A matrix stores damping as positive magnitudes; -1.0 makes it dissipative.
    damping_sign: -1.0

    # Determines the minimum % at which joystick are detected.
    # 0.1 means 10% of the joystick will be ignored
    # Increase the value if your joysticks are loose and cause unwanted movements
    joy_dead_zone: 0.2

    # Prototype MANUAL_ASSISTED mode:
    # joystick -> bounded target "carrot" -> LQR -> thrusters.
    manual_assisted:
      default_depth_target: -0.5
      min_depth_target: -1.0
      max_depth_target: 0.0
      depth_step: 0.1
      max_depth_offset: 0.25
      max_carrot_distance: 0.35
      max_carrot_speed: 0.35
      max_forward_speed: 0.5
      max_strafe_speed: 0.0
      max_yaw_rate: 0.6
      max_roll_deg: 20.0
      max_pitch_deg: 15.0
      joystick_curve: 1.6
      gamepad_timeout_sec: 0.75
