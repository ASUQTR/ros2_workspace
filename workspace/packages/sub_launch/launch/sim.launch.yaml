launch:
  # load script arguments, fallback to default
  - arg:
      name: "urdf_file"
      default: "$(find-pkg-share sub_launch)/urdf/asuqtr_sub.urdf"
  - arg:
      name: "ekf_config_file"
      default: "$(find-pkg-share sub_control)/config/robot_localization.yaml"
  
  # 1. Sub control
  - node:
      pkg: "sub_control"
      exec: "control_node.py"
      name: "control_node"
      param:
        - from: "$(find-pkg-share sub_control)/config/params.yaml"

  # The TF Tree (Loads Sub geometry)
  - node:
      pkg: "robot_state_publisher"
      exec: "robot_state_publisher"
      name: "robot_state_publisher"
      param:
        - name: "robot_description"
          value: "$(command 'cat $(var urdf_file)')"

  # Sensor Fusion
  - node:
      pkg: "robot_localization"
      exec: "ekf_node"
      name: "ekf_filter_node"
      param:
        - from: "$(var ekf_config_file)"

  # Sonar Node
  - node:
      pkg: "sub_hardware"
      exec: "sonar_node.py"
      name: "sonar_node"
      output: "screen"

  # Sonar Localization Node
  - node:
      pkg: "sub_control"
      exec: "sonar_localization.py"
      name: "sonar_localization"
