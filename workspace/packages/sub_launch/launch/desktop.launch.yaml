launch:
  # load script arguments, fallback to default
  - arg:
      name: "urdf_file"
      default: "$(find-pkg-share sub_launch)/urdf/asuqtr_sub.urdf"
  - arg:
      name: "ekf_config_file"
      default: "$(find-pkg-share sub_control)/config/robot_localization_imu_only.yaml"

  # 1. Sub control
  - node:
      pkg: "sub_control"
      exec: "control_node.py"
      name: "control_node"
      param:
        - from: "$(find-pkg-share sub_control)/config/params.yaml"

  # The TF Tree (Loads Sub geometry)
  - node:
      pkg: "robot_state_publisher"
      exec: "robot_state_publisher"
      name: "robot_state_publisher"
      param:
        - name: "robot_description"
          value: "$(command 'cat $(var urdf_file)')"

  # Sensor Fusion — IMU only by default (Bar30/DVL not available on desktop)
  - node:
      pkg: "robot_localization"
      exec: "ekf_node"
      name: "ekf_filter_node"
      param:
        - from: "$(var ekf_config_file)"

  # IMU Driver — VectorNav connected via USB (/dev/ttyUSB0)
  - node:
      pkg: "vectornav"
      exec: "vectornav"
      name: "vectornav"
      param:
        - from: "$(find-pkg-share vectornav)/config/vectornav.yaml"

  # ROSbridge for ASUQTR dashboard
  - node:
      pkg: "rosbridge_server"
      exec: "rosbridge_websocket"
      name: "rosbridge_websocket"

  # Nodes intentionally excluded (Xavier hardware only):
  #   actuator_node  — PCA9685 PWM via I2C
  #   sensor_node    — Bar30 depth sensor via I2C
  #   gpio_node      — Jetson Xavier 40-pin GPIO
  #   dvl_node       — DVL not connected in desktop mode
